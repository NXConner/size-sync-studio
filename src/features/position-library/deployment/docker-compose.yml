version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: position-library-db
    environment:
      POSTGRES_DB: position_library
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - position-library-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: position-library-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - position-library-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Server
  api:
    build:
      context: ../../../
      dockerfile: src/features/position-library/deployment/Dockerfile.api
    container_name: position-library-api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-password}@postgres:5432/position_library
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-secret-key}
      API_PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - position-library-network
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

  # Frontend (if serving from same deployment)
  frontend:
    build:
      context: ../../../
      dockerfile: src/features/position-library/deployment/Dockerfile.frontend
    container_name: position-library-frontend
    environment:
      REACT_APP_API_BASE_URL: http://localhost:3001/api
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - position-library-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: position-library-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - api
      - frontend
    networks:
      - position-library-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  position-library-network:
    driver: bridge
